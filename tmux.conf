# Preference
set -sg escape-time 10
set -g mouse on
set -g set-clipboard on
set -g history-limit 16384
set -g display-time 4000
set -g allow-rename on
set -g extended-keys on # Allow modified Enter keys for Pi
set -g extended-keys-format csi-u # More reliable way to send modified keys
set -g base-index 1
set -g pane-base-index 1
set -g status-interval 4
set -g status-left "[#I.#P]"
set -g status-right "%F %H:%M:%S"
set -g window-status-format ""
set -g window-status-current-format "#W"
set -ga terminal-overrides ",*-256color*:Tc" # Enable true color for env with $TERM=*-256color*

# Bindings
unbind -n MouseDown3Pane  # Disable right-click menu
