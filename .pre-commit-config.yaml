# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks
repos:
  - repo: local
    hooks:
      - id: stylua
        name: stylua
        entry: stylua
        language: system
        types: [lua]

      - id: shfmt
        name: shfmt
        entry: shfmt
        language: system
        types: [shell]
        args: [-w, -i, "2", -ci]
